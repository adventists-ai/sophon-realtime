# Sophon-Realtime vision, ONE dedicated GPU, long context (32k) for agent benches with many tools: FP8 thinker, KV share raised to 0.75.
base_config: sophon_realtime.yaml
session_mode: duplex
duplex_session:
  max_sessions: 32
  idle_ttl_s: 60
  server_vad_model_path: config/silero_vad.onnx
stages:
  - stage_id: 0
    devices: "0"
    quantization: fp8
    gpu_memory_utilization: 0.75
    max_model_len: 32768
    limit_mm_per_prompt:
      audio: 20
      image: 2
  - stage_id: 1
    devices: "0"
    gpu_memory_utilization: 0.10
  - stage_id: 2
    devices: "0"
    gpu_memory_utilization: 0.05
