# Sophon-Realtime vision, ONE GPU: thinker pre-quantized FP8 checkpoint (about 33 GB), talker + code2wav on the same card.
base_config: sophon_realtime.yaml
session_mode: duplex
duplex_session:
  max_sessions: 32
  idle_ttl_s: 60
  server_vad_model_path: config/silero_vad.onnx
stages:
  - stage_id: 0
    devices: "0"
    gpu_memory_utilization: 0.62
    max_model_len: 8192
    limit_mm_per_prompt:
      audio: 20
      image: 2
  - stage_id: 1
    devices: "0"
    gpu_memory_utilization: 0.10
  - stage_id: 2
    devices: "0"
    gpu_memory_utilization: 0.05
